name: Idempotency Migration Bootstrap

on:
  push:
    branches:
      - feat/idempotent-user-create
    paths:
      - .github/workflows/idempotency-migration-bootstrap.yml
      - src/db/schema/**

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/idempotent-user-create
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: bun ci
      - run: bun run db:generate
      - name: Commit generated migration
        run: |
          test -n "$(git status --porcelain -- drizzle)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "db: generate idempotency ledger migration"
          git push origin HEAD:feat/idempotent-user-create
