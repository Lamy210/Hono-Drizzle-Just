name: Graphify Bootstrap

on:
  push:
    branches:
      - chore/graphify-integration

permissions:
  contents: write

jobs:
  generate:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap Graphify project skill' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - run: bun ci
      - name: Verify Graphify contract is RED before generation
        run: |
          set +e
          bun test tests/unit/tooling/graphify-integration.test.ts > "${RUNNER_TEMP}/graphify-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/graphify-red.log"
          test "$status" -ne 0
          grep -F "Graphify project Agent Skill is committed" "${RUNNER_TEMP}/graphify-red.log"
          grep -F "Expected: true" "${RUNNER_TEMP}/graphify-red.log"
          grep -F "Received: false" "${RUNNER_TEMP}/graphify-red.log"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install pinned Graphify
        run: uv tool install "graphifyy==$(tr -d '\r\n' < .graphify-version)"
      - name: Generate project-scoped Agent Skill
        run: graphify install --project --platform agents
      - name: Verify Graphify contract is GREEN after generation
        run: bun test tests/unit/tooling/graphify-integration.test.ts
      - name: Commit generated Agent Skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/graphify
          git diff --cached --quiet || git commit -m "chore: generate Graphify project skill"
          git push
