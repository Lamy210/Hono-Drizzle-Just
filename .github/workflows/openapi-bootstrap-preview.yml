name: OpenAPI Bootstrap Preview

on:
  push:
    branches:
      - test/openapi-contract-gate

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install
      - run: bun run openapi:generate
      - run: bun run openapi:contract
      - name: Print generated assets
        run: |
          echo "=== BUN_LOCK_DIFF_BEGIN ==="
          git diff -- bun.lock
          echo "=== BUN_LOCK_DIFF_END ==="
          echo "=== OPENAPI_SNAPSHOT_BEGIN ==="
          cat openapi/openapi.json
          echo "=== OPENAPI_SNAPSHOT_END ==="
