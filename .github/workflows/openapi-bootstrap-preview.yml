name: OpenAPI Bootstrap Preview

on:
  push:
    branches:
      - test/openapi-contract-gate

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install
      - run: bun run openapi:generate
      - run: bun run openapi:contract
      - name: Commit generated contract assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock openapi/openapi.json
          if git diff --cached --quiet; then
            echo "Generated contract assets are already committed."
          else
            git commit -m "chore: commit generated OpenAPI contract"
            git push origin HEAD:test/openapi-contract-gate
          fi
