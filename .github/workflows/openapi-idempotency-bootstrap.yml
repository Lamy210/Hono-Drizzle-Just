name: Idempotency OpenAPI Bootstrap

on:
  push:
    branches:
      - feat/idempotent-user-create

permissions:
  contents: write

jobs:
  generate:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap idempotency OpenAPI snapshot' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - run: bun ci
      - run: bun run openapi:generate
      - run: bun run openapi:contract
      - name: Commit generated OpenAPI snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json
          git diff --cached --quiet || git commit -m "chore: regenerate idempotency OpenAPI contract"
          git push
