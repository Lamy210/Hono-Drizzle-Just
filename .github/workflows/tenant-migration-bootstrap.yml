name: Tenant Migration Bootstrap

on:
  push:
    branches:
      - feat/tenant-authorization-boundary

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: bun ci
      - name: Generate Drizzle migration metadata
        run: bun run db:generate
      - name: Replace generated SQL with safe legacy backfill
        shell: bash
        run: |
          set -euo pipefail
          migration="$(find drizzle -maxdepth 1 -type f -name '0001_*.sql' -print -quit)"
          test -n "$migration"
          cat > "$migration" <<'SQL'
          ALTER TABLE "users" ADD COLUMN "tenant_id" varchar(128);
          UPDATE "users" SET "tenant_id" = '__legacy__:' || "id"::text WHERE "tenant_id" IS NULL;
          ALTER TABLE "users" ALTER COLUMN "tenant_id" SET NOT NULL;
          ALTER TABLE "users" DROP CONSTRAINT "users_email_unique";
          ALTER TABLE "users" ADD CONSTRAINT "users_tenant_id_email_unique" UNIQUE("tenant_id","email");
          SQL
      - name: Validate generated migration metadata
        run: bun run db:check
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "db: add tenant ownership migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
