name: Graphify README Bootstrap

on:
  push:
    branches:
      - chore/graphify-integration

permissions:
  contents: write

jobs:
  patch-readme:
    if: "${{ github.event.head_commit.message == 'docs: bootstrap Graphify README link' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - run: bun ci
      - name: Add README developer-tool link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          needle = """just dev
          ```

          ## Using this template"""
          replacement = """just dev
          ```

          Optional developer tooling: [Graphify developer workflow](docs/development/graphify.md).

          ## Using this template"""
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one README insertion point, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
      - name: Verify Graphify tooling contract
        run: bun test tests/unit/tooling/graphify-integration.test.ts
      - name: Commit README link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: link Graphify developer workflow"
          git push
