name: OpenAPI Snapshot Bootstrap

on:
  push:
    branches:
      - feat/tenant-authorization-boundary

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: bun ci
      - name: Generate OpenAPI snapshot
        run: bun run openapi:generate
      - name: Verify generated snapshot
        run: bun run openapi:contract
      - name: Commit generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json
          if git diff --cached --quiet; then
            echo "No OpenAPI snapshot changes to commit"
            exit 0
          fi
          git commit -m "docs: refresh OpenAPI tenant auth contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
