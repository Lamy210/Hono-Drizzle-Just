name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: test -f bun.lock
      - run: bun ci
      - run: bun run check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: test -f bun.lock
      - run: bun ci
      - run: bun run test:coverage
      - run: test -s coverage/lcov.info

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: test -f bun.lock
      - run: bun ci
      - run: bun run openapi:contract
      - name: Check OpenAPI breaking changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:openapi/openapi.json" 2>/dev/null; then
            git show "${BASE_SHA}:openapi/openapi.json" > "${RUNNER_TEMP}/openapi-base.json"
            bash scripts/openapi/oasdiff.sh breaking "${RUNNER_TEMP}/openapi-base.json" openapi/openapi.json --fail-on ERR
          else
            echo "OpenAPI baseline not present on base commit; bootstrap comparison skipped."
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: test -f bun.lock
      - run: bun ci
      - run: bun run ci:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify Bun toolchain version
        run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"
      - run: test -f bun.lock
      - run: bun ci
      - run: bun run ci:e2e

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, integration, coverage, e2e, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$CONTRACT_RESULT" = "success"
